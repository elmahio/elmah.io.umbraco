name: build

on:
  push:
    branches: [ main, apiv4 ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Check vulnerable NuGet packages
      uses: elmahio/github-check-vulnerable-nuget-packages-action@v2
      with:
        projects: src/Elmah.Io.Umbraco/Elmah.Io.Umbraco.csproj

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --no-restore --verbosity normal

    - name: Pack
      run: dotnet pack --configuration Release src/Elmah.Io.Umbraco/Elmah.Io.Umbraco.csproj /p:Version=6.0.${{ github.run_number }}-pre

    - name: Install dotnet-validate
      run: dotnet tool install --global dotnet-validate --version 0.0.1-preview.582

    - name: Validate Elmah.Io.Umbraco
      run: dotnet-validate package local src/Elmah.Io.Umbraco/bin/Release/Elmah.Io.Umbraco.6.0.${{ github.run_number }}-pre.nupkg

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
      if: ${{ github.event_name == 'push' }}

    - name: Push Elmah.Io.Umbraco to nuget.org
      run: dotnet nuget push src/Elmah.Io.Umbraco/bin/Release/Elmah.Io.Umbraco.6.0.${{ github.run_number }}-pre.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      if: ${{ github.event_name == 'push' }}

